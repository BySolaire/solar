  fr: "%{title} · tentative %{n}"
mission.attempt.brief:
  en: "Attempt %{n} of a mission: an earlier attempt did not work out and was set aside. Carry out the approved plan below, from the project as it is now.%{issues}\n\n## Approved plan\n\n%{plan}"
  fr: "Tentative %{n} d'une mission : une tentative précédente n'a pas abouti et a été mise de côté. Réalise le plan approuvé ci-dessous, à partir du projet tel qu'il est maintenant.%{issues}\n\n## Plan approuvé\n\n%{plan}"
mission.attempt.issues:
  en: "\n\nThe reviewer had found these problems in the earlier attempt; avoid them:\n\n%{text}"
  fr: "\n\nLe relecteur avait relevé ces problèmes dans la tentative précédente ; évite-les :\n\n%{text}"
mission.relaunch:
