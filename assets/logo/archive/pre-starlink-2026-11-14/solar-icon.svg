<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" color="#F5F5F2">
  <title id="title">SOLAR — icône application</title>
  <desc id="desc">Éclipse blanche et titane sur une tuile noire, lumière chaude localisée en haut à droite. Contour extérieur transparent.</desc>
  <defs><linearGradient id="tile" x1="250" y1="80" x2="760" y2="944" gradientUnits="userSpaceOnUse"><stop stop-color="#1B1D22"/><stop offset=".48" stop-color="#0D0E11"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <linearGradient id="ring" x1="280" y1="740" x2="720" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#F5F5F2" stop-opacity=".08"/><stop offset=".3" stop-color="#A7ADB4" stop-opacity=".3"/><stop offset=".68" stop-color="#F5F5F2"/><stop offset=".88" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9B86B" stop-opacity=".6"/></linearGradient>
    <linearGradient id="edge" x1="180" y1="80" x2="830" y2="944" gradientUnits="userSpaceOnUse"><stop stop-color="#C5CBD4" stop-opacity=".25"/><stop offset=".4" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".1"/></linearGradient>
    <radialGradient id="disc" cx=".4" cy=".35" r=".8"><stop stop-color="#0E0F12"/><stop offset="1" stop-color="#040405"/></radialGradient>
    <radialGradient id="corona"><stop stop-color="#FFF1DA" stop-opacity=".9"/><stop offset=".25" stop-color="#E9B86B" stop-opacity=".38"/><stop offset=".6" stop-color="#E9B86B" stop-opacity=".1"/><stop offset="1" stop-color="#E9B86B" stop-opacity="0"/></radialGradient>
    <radialGradient id="hot"><stop stop-color="#FFFFFF"/><stop offset=".25" stop-color="#FFF8EA"/><stop offset="1" stop-color="#FFF0D4" stop-opacity="0"/></radialGradient>
    <mask id="crescent" maskUnits="userSpaceOnUse" x="240" y="240" width="544" height="544"><circle cx="512" cy="512" r="246" fill="#FFFFFF"/><circle cx="507" cy="517" r="232" fill="#000000"/></mask></defs>
  <rect x="80" y="80" width="864" height="864" rx="192" fill="url(#tile)"/>
    <rect x="80" y="80" width="864" height="864" rx="192" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <circle cx="512" cy="512" r="245" fill="url(#disc)"/>
    <circle cx="512" cy="512" r="246" fill="url(#ring)" mask="url(#crescent)"/>
    <ellipse cx="686" cy="338" rx="52" ry="40" fill="url(#corona)"/>
    <ellipse cx="686" cy="338" rx="19" ry="13" fill="url(#hot)"/>
    <path d="M658 327 L682 334 L707 354 L688 342Z" fill="#FFFDF8"/>
    <circle cx="686" cy="338" r="5" fill="#FFFFFF"/>
</svg>
